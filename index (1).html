<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>Automations Hub</title>
  <meta name="theme-color" content="#6366f1">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; height: 100%;
      background: #101114; color: #f2f3f7;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex; align-items: center; justify-content: center;
    }
    .splash { text-align: center; }
    .logo {
      width: 72px; height: 72px; border-radius: 20px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      display: flex; align-items: center; justify-content: center;
      font-size: 34px; margin: 0 auto 18px;
      box-shadow: 0 12px 32px rgba(99,102,241,0.35);
    }
    .title { font-size: 18px; font-weight: 700; margin-bottom: 6px; }
    .subtitle { font-size: 13px; color: #9498a8; margin-bottom: 24px; }
    .spinner {
      width: 26px; height: 26px; border-radius: 50%;
      border: 3px solid rgba(255,255,255,0.15); border-top-color: #6366f1;
      animation: spin 0.8s linear infinite; margin: 0 auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .manual-open {
      display: none; margin-top: 20px; padding: 12px 24px; border-radius: 12px;
      background: #6366f1; color: #fff; text-decoration: none; font-weight: 700; font-size: 14px;
    }
    .offline-msg { display: none; font-size: 13px; color: #ef4444; margin-top: 16px; }
  </style>
</head>
<body>
  <div class="splash">
    <div class="logo">🚀</div>
    <div class="title">Automations Hub</div>
    <div class="subtitle" id="statusText">Connecting…</div>
    <div class="spinner" id="spinner"></div>
    <a class="manual-open" id="manualOpen" href="#">Open Dashboard</a>
    <div class="offline-msg" id="offlineMsg">No internet connection. Reconnect and try again.</div>
  </div>

  <script>
    // ============================================================
    // CONFIG — set this to your Apps Script web app's /exec URL
    // ============================================================
    const DASHBOARD_URL = 'https://script.google.com/macros/s/YOUR_DEPLOYMENT_ID_HERE/exec';

    // Register the service worker so Chrome recognizes this as a real,
    // installable PWA (manifest + SW is the actual requirement).
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }

    function redirectNow() {
      window.location.replace(DASHBOARD_URL);
    }

    document.getElementById('manualOpen').href = DASHBOARD_URL;

    if (!navigator.onLine) {
      document.getElementById('spinner').style.display = 'none';
      document.getElementById('statusText').textContent = 'Offline';
      document.getElementById('offlineMsg').style.display = 'block';
      document.getElementById('manualOpen').style.display = 'inline-block';
    } else {
      // Brief pause so Chrome has a moment to evaluate installability
      // (manifest + SW) before we navigate away from this page.
      setTimeout(redirectNow, 700);

      // Fallback: if redirect somehow didn't happen (blocked popup,
      // slow SW registration, etc.), reveal a manual button.
      setTimeout(() => {
        document.getElementById('statusText').textContent = 'Taking longer than expected';
        document.getElementById('manualOpen').style.display = 'inline-block';
      }, 4000);
    }
  </script>
</body>
</html>
